user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;

        client_max_body_size 40m;

        # SSO code-mint endpoint is server-to-server only (jcnr-triage runs
        # on this same host and calls it via the public hostname/IP, since
        # this proxy only listens on the host's real interface address, not
        # 127.0.0.1). A genuine remote attacker cannot spoof the source IP
        # over TCP, so restricting to the host's own address is a real
        # boundary here, not just cosmetic. Defense in depth alongside the
        # shared-secret check the app itself also performs.
        location /internal/ {
            allow 10.204.216.91;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://sync-server:4300;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://sync-server:4300;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1900s;
            proxy_send_timeout 1900s;
        }
    }
}
