# Operator runtime directory for the tracked nodem2 deployment.
#
# Installed as /etc/tmpfiles.d/ariadne.conf by deploy/nodem2/scripts/install.
# systemd-tmpfiles-setup.service runs before docker.service, so the directory
# exists with the ownership the sync-server container needs (gid 10001 =
# ariadne-web) before Compose starts any service on a fresh boot. The operator
# unit re-asserts the same mode through RuntimeDirectory= and then creates the
# request socket and the callback token inside it.
#
# Type Path         Mode Owner Group       Age Argument
d /run/ariadne 0750 root ariadne-web - -
